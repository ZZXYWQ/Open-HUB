[workspace]
resolver = "3"
members = ["crates/gearwise-core","crates/gearwise-hid","crates/gearwise-razer","crates/gearwise-corsair","crates/gearwise-steelseries","crates/gearwise-input"]
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Dhiva-Labs/gearwise"
rust-version = "1.85"
[workspace.dependencies]
gearwise-core = { path = "crates/gearwise-core" }
gearwise-hid = { path = "crates/gearwise-hid" }
gearwise-razer = { path = "crates/gearwise-razer" }
gearwise-corsair = { path = "crates/gearwise-corsair" }
gearwise-steelseries = { path = "crates/gearwise-steelseries" }
gearwise-input = { path = "crates/gearwise-input" }
serde = {version="1",features=["derive"]}
serde_json = "1"
thiserror = "2"
log = "0.4"
[profile.release]
lto = false
codegen-units = 16
