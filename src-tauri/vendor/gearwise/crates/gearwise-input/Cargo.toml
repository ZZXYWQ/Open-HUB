[package]
name = "gearwise-input"
description = "Host-side input injection, macro playback and focused-app detection for Gearwise"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
gearwise-core.workspace = true
log.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.172"
# Pure-Rust X11 client (`RustConnection`); no libxcb, no extensions needed.
x11rb = { version = "0.14", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
