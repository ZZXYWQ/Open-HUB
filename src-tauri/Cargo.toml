[package]
name = "open-ghub"
version = "0.1.2"
description = "Configure Logitech HID++ 2.0 mice (DPI, report rate, profiles)"
authors = ["Abidur Rahman"]
license = "GPL-3.0-or-later"
repository = "https://github.com/abidr/open-ghub"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
# Read-only import of G HUB's settings.db.
rusqlite = { version = "0.37", features = ["bundled"] }

# The pure-Rust Windows backend avoids compiling the C hidapi library.
[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
# Foreground-window hook (auto-switch) and device arrival notifications.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_Devices_DeviceAndDriverInstallation"] }

[target.'cfg(not(windows))'.dependencies]
hidapi = "2.6"

[profile.release]
lto = true
codegen-units = 1
strip = true
